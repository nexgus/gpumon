<!doctype html>

<meta charset="utf-8">

<title>SSH 登入流程</title>
<style>
:root {
  --bg: #ffffff; --text: #1c2430; --muted: #5b6675; --line: #5b6675;
  --process-fill: #eef3fb; --process-stroke: #4a6fa5;
  --decision-fill: #fff6e0; --decision-stroke: #b07d12;
  --terminal-fill: #e9f5ec; --terminal-stroke: #3d8a55;
  --band0: #f7f9fc; --band-stroke: #dfe4ea; --link: #1f5fbf; --mark: #d2462c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181e; --text: #e6eaf0; --muted: #9aa5b3; --line: #9aa5b3;
    --process-fill: #1e2a3d; --process-stroke: #6f97d1;
    --decision-fill: #3a2f14; --decision-stroke: #d6a53a;
    --terminal-fill: #1b3324; --terminal-stroke: #62b57d;
    --band0: #181d25; --band-stroke: #2a313b; --link: #8ab4f8; --mark: #ff8a70;
  }
}
html { scroll-behavior: smooth; }
body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.7; }
main { max-width: 1190px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 8px; }
p { margin: 0 0 16px; }
h2 { font-size: 1.2rem; margin: 48px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--band-stroke); scroll-margin-top: 12px; }
h2 .back { float: right; font-size: 0.85rem; font-weight: 400; }
a { color: var(--link); }
nav.figs { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 8px; }
svg { width: 100%; height: auto; display: block; }
svg.defs { width: 0; height: 0; position: absolute; }
.node { stroke-width: 1.6; }
.process { fill: var(--process-fill); stroke: var(--process-stroke); }
.subbar { stroke: var(--process-stroke); stroke-width: 1.6; }
.decision { fill: var(--decision-fill); stroke: var(--decision-stroke); }
.terminal { fill: var(--terminal-fill); stroke: var(--terminal-stroke); }
.connector { fill: var(--bg); stroke: var(--line); }
.ntext { font-size: 14px; fill: var(--text); }
.ntext.link { fill: var(--link); text-decoration: underline; }
.code { font-size: 11px; font-weight: 600; fill: var(--muted); }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
.arrowhead { fill: var(--line); }
.elabel { font-size: 13px; font-weight: 600; fill: var(--text); }
g.n { scroll-margin: 120px; }
g.n:target > .node { stroke: var(--mark); stroke-width: 4; }
g.n:target > .code { fill: var(--mark); }
</style>
</head>

<text class="ntext" x="590" y="260.0" text-anchor="middle" dominant-baseline="central">依序列出使用者指定的金鑰檔</text>
<text class="ntext" x="590" y="280.0" text-anchor="middle" dominant-baseline="central">與 SSH 設定檔指定的金鑰檔,</text>
<text class="ntext" x="590" y="300.0" text-anchor="middle" dominant-baseline="central">兩者皆無時列出預設名稱的金鑰檔,</text>

<text class="ntext" x="590" y="911.0" text-anchor="middle" dominant-baseline="central">不存在時, 在程式的目錄中</text>
<text class="ntext" x="590" y="931.0" text-anchor="middle" dominant-baseline="central">建立空檔案</text>
</g>

<text class="ntext" x="590" y="1017.0" text-anchor="middle" dominant-baseline="central">遠端主機已記錄的主機金鑰</text>
<text class="ntext" x="590" y="1037.0" text-anchor="middle" dominant-baseline="central">種類, 排定優先接受的種類</text>
</g>

<text class="ntext" x="590" y="1103.0" text-anchor="middle" dominant-baseline="central">把上述設定, 要嘗試的金鑰, 以及</text>
<text class="ntext" x="590" y="1123.0" text-anchor="middle" dominant-baseline="central">處理主機金鑰與詢問密碼的方式</text>
<text class="ntext" x="590" y="1143.0" text-anchor="middle" dominant-baseline="central">交給函式庫, 開始連線與登入</text>

<text class="ntext" x="590" y="1258.0" text-anchor="middle" dominant-baseline="central">連線已建立?</text>
</g>

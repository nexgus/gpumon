<!--
  系統匣與選單列圖示的母版 (macOS 與 Windows 共用), 為黑底白形的單色遮罩, 白為實體,
  黑為鏤空. 章魚的頭部圓頂較大, 眼睛加大並位於圓頂內, 使 16 像素時仍看得出眼睛與眨眼.
  眨眼的影格由 generate.sh 將 tray-eyes.svg 的眼睛依比例填回本圖產生. 繪製順序即疊圖
  順序, 眼睛須最後畫才能鏤空.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64"><rect width="64" height="64" fill="#000"/><g fill="#fff"><ellipse cx="32" cy="14.5" rx="16.5" ry="13.5"/><ellipse cx="32" cy="27" rx="11" ry="8.5"/></g><g fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"><path d="M21,30.5 C17,26.5 11,25 7.5,27.5 C4,30 4,34.5 7,35.5 C9,36 10.5,34.5 10,33"/><path d="M23.5,35 C19,38.5 13.5,40 11,43.5 C8.5,47 9.5,51.5 13,51.5 C15,51.5 16,49.5 14.5,48"/><path d="M27.5,36 C27,41 24,45 22.5,49 C21,53 21.5,57.5 25,58 C27,58.2 28,56 26.5,54.8"/><g transform="translate(64 0) scale(-1 1)"><path d="M21,30.5 C17,26.5 11,25 7.5,27.5 C4,30 4,34.5 7,35.5 C9,36 10.5,34.5 10,33"/><path d="M23.5,35 C19,38.5 13.5,40 11,43.5 C8.5,47 9.5,51.5 13,51.5 C15,51.5 16,49.5 14.5,48"/><path d="M27.5,36 C27,41 24,45 22.5,49 C21,53 21.5,57.5 25,58 C27,58.2 28,56 26.5,54.8"/></g></g><g fill="#000"><path d="M22,25 Q28.5,24.2 30.8,31.8 Q23.8,33.2 22,25 Z" transform="translate(24.4 15.5) scale(1.45) translate(-26.4 -28.6)"/><path d="M42,25 Q35.5,24.2 33.2,31.8 Q40.2,33.2 42,25 Z" transform="translate(39.6 15.5) scale(1.45) translate(-37.6 -28.6)"/></g></svg>
